<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Main Idea Flashcards — Teen Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #eef3ff;
        --bg-dot: #d5e0f7;
        --card: #ffffff;
        --ink: #2d3142;
        --ink-soft: #5a5f7a;
        --coral: #ff6b6b;
        --coral-dark: #e14b4b;
        --teal: #0fb5a3;
        --teal-dark: #089e8c;
        --sun: #ffc93c;
        --sun-dark: #e0a800;
        --sky: #4dabf7;
        --pink: #f783ac;
        --good: #2fbf71;
        --good-dark: #1e9e57;
        --bar-track: #d5e0f7;
        --shadow: 0 6px 0 rgba(45, 49, 66, 0.12);
        --panel-good: #e6fbef;
        --panel-soft: #fff3d6;
        --level-easy: #d3f9f3;
        --level-medium: #fff0bf;
        --level-hard: #ffe3ec;
        --choice: #f4f7ff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1e2438;
          --bg-dot: #2a3250;
          --card: #313850;
          --ink: #f4f6ff;
          --ink-soft: #c3c9e0;
          --coral: #ff8585;
          --coral-dark: #ff6b6b;
          --teal: #2dd4bf;
          --teal-dark: #14b8a6;
          --sun: #ffd34d;
          --sun-dark: #ffc93c;
          --sky: #74c0fc;
          --pink: #faa2c1;
          --good: #51cf8a;
          --good-dark: #2fbf71;
          --bar-track: #454d68;
          --shadow: 0 6px 0 rgba(0, 0, 0, 0.35);
          --panel-good: #1f4634;
          --panel-soft: #4d4023;
          --level-easy: #274b47;
          --level-medium: #4d4426;
          --level-hard: #4a3542;
          --choice: #3a4260;
        }
      }

      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: "Fredoka", "Comic Sans MS", "Chalkboard SE", system-ui, sans-serif;
        background:
          radial-gradient(circle at 12% 18%, var(--bg-dot) 0 26px, transparent 27px),
          radial-gradient(circle at 88% 78%, var(--bg-dot) 0 34px, transparent 35px),
          radial-gradient(circle at 78% 12%, var(--bg-dot) 0 18px, transparent 19px),
          var(--bg);
        color: var(--ink);
        min-height: 100vh;
        min-height: 100dvh;
      }

      .wrap { max-width: 680px; margin: 0 auto; padding: 18px 16px 40px; }

      .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
      .pill {
        background: var(--card); border-radius: 999px; padding: 10px 18px;
        font-size: 1.15rem; font-weight: 600; box-shadow: var(--shadow);
        display: inline-flex; align-items: center; gap: 8px; min-height: 48px;
      }
      .pill .star-ico { font-size: 1.3rem; line-height: 1; }
      #scorePill.pop { animation: pop 0.35s ease; }
      @keyframes pop {
        0% { transform: scale(1); }
        40% { transform: scale(1.18) rotate(-2deg); }
        100% { transform: scale(1); }
      }

      .progress-shell {
        margin-top: 14px; background: var(--bar-track); border-radius: 999px;
        height: 26px; overflow: hidden; box-shadow: inset 0 2px 4px rgba(0,0,0,0.12);
      }
      .progress-fill {
        height: 100%; width: 0%; border-radius: 999px;
        background: repeating-linear-gradient(-45deg, var(--teal) 0 16px, var(--teal-dark) 16px 32px);
        transition: width 0.55s cubic-bezier(0.34, 1.4, 0.64, 1);
      }
      .progress-label { margin-top: 8px; text-align: center; font-weight: 600; font-size: 1.05rem; color: var(--ink-soft); }

      .card {
        margin-top: 18px; background: var(--card); border-radius: 28px;
        box-shadow: var(--shadow); padding: 24px 18px; text-align: center;
      }
      .level-badge {
        display: inline-block; border-radius: 999px; padding: 8px 20px;
        font-size: 1.1rem; font-weight: 700; letter-spacing: 0.14em; margin-bottom: 10px;
        box-shadow: 0 3px 0 rgba(45, 49, 66, 0.15);
      }
      .level-badge.easy { background: var(--level-easy); }
      .level-badge.medium { background: var(--level-medium); }
      .level-badge.hard { background: var(--level-hard); }
      .big-emoji { font-size: clamp(2.8rem, 12vw, 3.8rem); line-height: 1.1; display: block; animation: bob 2.4s ease-in-out infinite; }
      @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

      .passage-card {
        margin-top: 14px; background: var(--bg); border-radius: 20px;
        padding: 20px 18px; text-align: left;
        box-shadow: inset 0 2px 6px rgba(45, 49, 66, 0.08);
      }
      .passage-title { margin: 0 0 8px; font-size: 1rem; font-weight: 700; letter-spacing: 0.1em; color: var(--ink-soft); text-transform: uppercase; }
      .passage-text { margin: 0; font-size: clamp(1.02rem, 4.4vw, 1.18rem); line-height: 1.65; font-weight: 500; }
      .prompt { margin: 16px 0 0; font-size: clamp(1.35rem, 5.5vw, 1.7rem); font-weight: 700; color: var(--coral-dark); }

      /* ---------- Choice cards ---------- */
      .choices { margin-top: 14px; display: flex; flex-direction: column; gap: 12px; }
      .choice {
        font-family: inherit;
        border: none; border-radius: 18px; background: var(--choice);
        padding: 16px 16px; min-height: 64px;
        font-size: clamp(1rem, 4.2vw, 1.12rem); font-weight: 600; line-height: 1.45;
        color: var(--ink); text-align: left; cursor: pointer; touch-action: manipulation;
        box-shadow: 0 4px 0 rgba(45, 49, 66, 0.12);
        transition: transform 0.12s ease, opacity 0.25s ease;
        display: flex; align-items: center; gap: 12px;
      }
      .choice:active:not(:disabled) { transform: translateY(2px); }
      .choice:disabled { cursor: default; }
      .choice-letter {
        flex: 0 0 auto; width: 38px; height: 38px; border-radius: 50%;
        background: var(--sky); color: #fff; font-weight: 700;
        display: flex; align-items: center; justify-content: center; font-size: 1.1rem;
      }
      @media (prefers-color-scheme: dark) { .choice-letter { color: #0d2b45; } }
      .choice.is-dim { opacity: 0.4; }
      .choice.is-wrongpick { animation: gentle-shake 0.45s ease; }
      .choice.is-correct { outline: 4px solid var(--good); outline-offset: -4px; background: var(--panel-good); }
      @keyframes gentle-shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-8px); }
        75% { transform: translateX(8px); }
      }

      .pop-particle { position: fixed; z-index: 60; pointer-events: none; border-radius: 50%; }

      /* ---------- Feedback + say-it ---------- */
      .feedback {
        margin-top: 18px; border-radius: 22px; padding: 18px 16px;
        font-size: clamp(1.1rem, 4.8vw, 1.3rem); font-weight: 600; line-height: 1.5; display: none; text-align: left;
      }
      .feedback.show { display: block; animation: rise 0.3s ease; }
      .feedback.good { background: var(--panel-good); }
      .feedback.soft { background: var(--panel-soft); }
      .feedback .points {
        display: inline-block; margin-top: 8px; background: var(--sun); color: #4d3b00;
        border-radius: 999px; padding: 4px 16px; font-weight: 700;
      }
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

      .sayit-zone { margin-top: 18px; display: none; }
      .sayit-zone.show { display: block; animation: rise 0.3s ease; }
      .big-btn {
        font-family: inherit; width: 100%; border: none; border-radius: 22px;
        padding: 20px 16px; min-height: 84px; font-size: clamp(1.5rem, 6.5vw, 2rem);
        font-weight: 700; cursor: pointer; touch-action: manipulation;
        transition: transform 0.12s ease, box-shadow 0.12s ease;
      }
      .big-btn:active { transform: translateY(3px); }
      .btn-say { background: var(--sky); color: #fff; box-shadow: 0 6px 0 #2f7fc4; }
      @media (prefers-color-scheme: dark) { .btn-say { color: #0d2b45; } }
      .btn-say:active { box-shadow: 0 2px 0 #2f7fc4; }
      .btn-said { background: var(--sun); color: #4d3b00; box-shadow: 0 6px 0 var(--sun-dark); display: none; }
      .btn-said.show { display: block; }
      .btn-said:active { box-shadow: 0 2px 0 var(--sun-dark); }
      .sayit-hint { margin: 10px 0 0; font-size: 1.05rem; font-weight: 500; color: var(--ink-soft); }

      /* ---------- Win screen ---------- */
      .win { display: none; text-align: center; }
      .win.show { display: block; }
      .win .trophy { font-size: clamp(4.5rem, 22vw, 6.5rem); display: block; animation: bob 2s ease-in-out infinite; }
      .win h2 { margin: 8px 0 4px; font-size: clamp(2rem, 9vw, 3rem); font-weight: 700; color: var(--coral-dark); }
      .win p { font-size: 1.25rem; font-weight: 500; color: var(--ink-soft); margin: 6px 0; }
      .win .final-score { font-size: clamp(1.8rem, 8vw, 2.4rem); font-weight: 700; color: var(--ink); margin: 14px 0 4px; }
      .stars { font-size: clamp(3rem, 14vw, 4.2rem); letter-spacing: 0.12em; margin: 10px 0 6px; }
      .stars .earned { color: var(--sun-dark); display: inline-block; animation: star-in 0.5s ease backwards; }
      .stars .earned:nth-child(2) { animation-delay: 0.18s; }
      .stars .earned:nth-child(3) { animation-delay: 0.36s; }
      .stars .dim { color: var(--bar-track); }
      @keyframes star-in { from { transform: scale(0) rotate(-40deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
      .btn-again { margin-top: 20px; background: var(--coral); color: #fff; box-shadow: 0 6px 0 var(--coral-dark); }
      @media (prefers-color-scheme: dark) { .btn-again { color: #451010; } }
      .btn-again:active { box-shadow: 0 2px 0 var(--coral-dark); }

      .friends-recap { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
      .friends-recap span { background: var(--panel-good); border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: 1rem; }

      #confetti-layer { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 50; }
      .confetti-piece { position: absolute; top: -4vh; will-change: transform, opacity; }

      @media (prefers-reduced-motion: reduce) {
        .big-emoji, .win .trophy { animation: none; }
        .choice.is-wrongpick, .feedback.show, .sayit-zone.show, #scorePill.pop, .stars .earned { animation: none; }
        .progress-fill { transition: none; }
      }
    </style>
    <link rel="apple-touch-icon" href="/main-idea-flashcards-teen/apple-touch-icon.png">
  </head>
  <body>
    <div id="confetti-layer" aria-hidden="true"></div>

    <div class="wrap">
      <div class="topbar">
        <span class="pill" id="roundPill">🃏 Card <span id="roundNow">1</span> of 12</span>
        <span class="pill" id="scorePill"><span class="star-ico" aria-hidden="true">⭐</span> <span id="scoreNow">0</span> points</span>
      </div>
      <div class="progress-shell" role="progressbar" aria-label="Game progress" aria-valuemin="0" aria-valuemax="12" aria-valuenow="0" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <p class="progress-label" id="progressLabel">Find all 12 main ideas! 🃏</p>

      <main class="card" id="gameCard">
        <span class="level-badge easy" id="levelBadge">⭐ EASY</span>
        <span class="big-emoji" id="bigEmoji" aria-hidden="true">💡</span>

        <div class="passage-card">
          <p class="passage-title">Read the passage</p>
          <p class="passage-text" id="passageText"></p>
        </div>

        <p class="prompt">What is the MAIN IDEA?</p>

        <div class="choices" id="choices" role="group" aria-label="Main idea choices"></div>

        <div class="feedback" id="feedback" aria-live="polite"></div>

        <div class="sayit-zone" id="sayitZone">
          <button class="big-btn btn-say" id="sayBtn" type="button">🔊 Say it!</button>
          <p class="sayit-hint" id="sayitHint">Tap to hear it, then say it out loud!</p>
          <button class="big-btn btn-said" id="saidBtn" type="button">🗣️ I said it! +100</button>
        </div>
      </main>

      <section class="card win" id="winCard" aria-live="polite">
        <span class="trophy" aria-hidden="true">🏆</span>
        <h2>You found them all!</h2>
        <p>Main ideas — you see the big picture! 🎉</p>
        <div class="stars" id="starsRow" aria-label="Stars earned"></div>
        <p class="final-score">⭐ <span id="finalScore">0</span> points</p>
        <p id="winMessage">Main idea master!</p>
        <div class="friends-recap" id="friendsRecap"></div>
        <button class="big-btn btn-again" id="againBtn" type="button">🔁 Play Again</button>
      </section>
    </div>

    <script>
      (function () {
        "use strict";

        // Main Idea flashcards — TEEN EDITION (ages 14–17).
        // Read a short passage, pick the best main idea from 4 choices.
        // Distractors: a true detail, a too-narrow/opposite take, a wrong take.
        // Progressive: easy → medium → hard passages.
        var CARDS = [
          // EASY
          { level: "easy", emoji: "😴",
            passage: "Teens need about eight to ten hours of sleep each night, but most get far less. When you don’t sleep enough, it’s harder to focus in class and remember what you studied. Athletes also perform worse when they’re tired. Getting enough sleep helps your brain and body work their best.",
            answer: "Getting enough sleep helps teens learn and perform better.",
            others: ["Teens should sleep exactly ten hours every single night.", "Athletes need extra sleep before every game.", "Sleep is more important than doing homework."] },
          { level: "easy", emoji: "📱",
            passage: "Scrolling through perfect photos online can make anyone feel like their life isn’t good enough. Most people only post their best moments, not the boring or hard parts. Comparing yourself to edited posts can hurt your confidence. Remembering that social media isn’t real life helps you feel better about yourself.",
            answer: "Comparing yourself to social media posts can hurt your confidence.",
            others: ["Everyone should delete all their social media apps.", "Nobody ever posts anything real online.", "Social media is only for sharing your best moments."] },
          { level: "easy", emoji: "💼",
            passage: "Getting a part-time job teaches you more than just how to earn money. You learn to show up on time, talk to customers, and solve problems. Saving part of each paycheck can help you afford big goals like a car or college. A job also looks great on college applications.",
            answer: "A part-time job teaches teens valuable skills and responsibility.",
            others: ["Teens should save every single penny they earn.", "A job is the only way to get into college.", "Talking to customers is the hardest part of any job."] },
          { level: "easy", emoji: "🏀",
            passage: "Winning teams aren’t always the ones with the best players. Teams that communicate and trust each other often beat more talented opponents. When players encourage each other instead of blaming mistakes, everyone plays better. Good teamwork can matter more than individual skill.",
            answer: "Good teamwork can matter more than individual talent.",
            others: ["The best player should always be team captain.", "Great teams never lose a single game.", "Blaming teammates helps them play better."] },
          // MEDIUM
          { level: "medium", emoji: "🎸",
            passage: "Learning to play an instrument takes patience because progress is slow at first. Practicing a little every day works better than cramming once a week. Over time, your fingers learn the movements without you even thinking about it. Sticking with it teaches you that steady effort pays off.",
            answer: "Learning an instrument takes daily practice and patience.",
            others: ["Everyone should learn to play the piano.", "Cramming once a week is the fastest way to learn.", "Your fingers do all the work when you play music."] },
          { level: "medium", emoji: "🤝",
            passage: "Volunteering at a food bank or animal shelter helps your community in real ways. It helps you too — volunteers often feel happier and less stressed. You can meet new people and discover careers you never thought about. Giving your time is one of the most valuable things you can do.",
            answer: "Volunteering helps both the community and the volunteer.",
            others: ["Everyone must volunteer every single weekend.", "Animal shelters need help more than anywhere else.", "Volunteering is only useful for meeting new people."] },
          { level: "medium", emoji: "📝",
            passage: "Feeling nervous before a big test is completely normal. Taking slow, deep breaths can calm your body down in just a minute. Studying a little each night beats staying up late cramming. Going in prepared and calm helps you show what you really know.",
            answer: "There are simple ways to manage test anxiety.",
            others: ["Nervous students should skip the test entirely.", "Cramming all night is the best way to study.", "Deep breathing takes a full minute to work."] },
          { level: "medium", emoji: "📚",
            passage: "Reading for fun might seem old-fashioned, but it builds your vocabulary faster than almost anything else. Stories let you live a thousand lives without leaving your room. Even twenty minutes a day can make you a stronger reader. The more you read, the easier school gets.",
            answer: "Reading for fun has big benefits for teens.",
            others: ["Everyone must read for exactly twenty minutes daily.", "School is easier than reading books.", "Vocabulary can only come from textbooks."] },
          // HARD
          { level: "hard", emoji: "💛",
            passage: "Even best friends argue sometimes, and that’s okay. Listening to the other person’s side before responding keeps small fights from getting bigger. Saying sorry when you’re wrong takes courage but saves friendships. Good friends work through disagreements instead of giving up on each other.",
            answer: "Good friends work through disagreements in healthy ways.",
            others: ["Best friends should never argue with each other.", "Saying sorry is easy for everyone.", "You should always agree with your friends."] },
          { level: "hard", emoji: "⏰",
            passage: "Juggling homework, sports, and friends can feel impossible without a plan. Writing down assignments and due dates keeps nothing from sneaking up on you. Doing the hardest task first makes the rest of the day feel easier. A little planning each evening saves hours of stress later.",
            answer: "Planning ahead helps teens manage a busy schedule.",
            others: ["Teens should quit sports to have more free time.", "Homework is the hardest part of every day.", "Evening planning takes several hours."] },
          { level: "hard", emoji: "🌱",
            passage: "Trying out for a play or joining a new club can feel scary. Most people feel nervous before trying something new — you’re not alone in that. You might discover a talent you never knew you had. Even if it doesn’t work out, you’ll be proud you were brave enough to try.",
            answer: "Trying new things takes courage but is worth it.",
            others: ["Everyone succeeds at everything they try.", "You should never feel nervous about anything.", "Clubs are only for people who are already talented."] },
          { level: "hard", emoji: "🏃",
            passage: "Exercise isn’t just good for your body — it’s great for your mind too. Moving around releases chemicals that boost your mood and lower stress. You don’t need a gym; a walk with music counts. Even short bursts of activity can clear your head on a tough day.",
            answer: "Exercise benefits both physical and mental health.",
            others: ["You must join a gym to get any exercise.", "Walking with music doesn’t count as exercise.", "Exercise only helps your muscles get stronger."] }
        ];
        var LEVEL_LABELS = { easy: "⭐ EASY", medium: "💪 MEDIUM", hard: "🔥 HARD" };
        var TOTAL = CARDS.length;
        var LETTERS = ["A", "B", "C", "D"];

        var rounds = [];
        var roundIndex = 0;
        var score = 0;
        var firstTryWins = 0;
        var locked = false;

        var el = {
          roundNow: document.getElementById("roundNow"),
          scoreNow: document.getElementById("scoreNow"),
          scorePill: document.getElementById("scorePill"),
          progressFill: document.getElementById("progressFill"),
          progressBar: document.getElementById("progressBar"),
          progressLabel: document.getElementById("progressLabel"),
          gameCard: document.getElementById("gameCard"),
          winCard: document.getElementById("winCard"),
          levelBadge: document.getElementById("levelBadge"),
          bigEmoji: document.getElementById("bigEmoji"),
          passageText: document.getElementById("passageText"),
          choices: document.getElementById("choices"),
          feedback: document.getElementById("feedback"),
          sayitZone: document.getElementById("sayitZone"),
          sayBtn: document.getElementById("sayBtn"),
          saidBtn: document.getElementById("saidBtn"),
          sayitHint: document.getElementById("sayitHint"),
          finalScore: document.getElementById("finalScore"),
          starsRow: document.getElementById("starsRow"),
          winMessage: document.getElementById("winMessage"),
          friendsRecap: document.getElementById("friendsRecap"),
          againBtn: document.getElementById("againBtn"),
          confettiLayer: document.getElementById("confetti-layer")
        };

        function shuffle(arr) {
          var a = arr.slice();
          for (var i = a.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var t = a[i]; a[i] = a[j]; a[j] = t;
          }
          return a;
        }

        function setScore(points) {
          score += points;
          el.scoreNow.textContent = score;
          el.scorePill.classList.remove("pop");
          void el.scorePill.offsetWidth;
          el.scorePill.classList.add("pop");
        }

        function setProgress(done) {
          var pct = Math.round((done / TOTAL) * 100);
          el.progressFill.style.width = pct + "%";
          el.progressBar.setAttribute("aria-valuenow", done);
          if (done >= TOTAL) el.progressLabel.textContent = "All 12 main ideas found! 🎉";
          else if (done === 0) el.progressLabel.textContent = "Find all 12 main ideas! 🃏";
          else el.progressLabel.textContent = done + " of 12 main ideas found! 🃏";
        }

        /* ---------- Confetti (hand-rolled, no library) ---------- */
        var CONFETTI_COLORS = ["#ff6b6b", "#ffc93c", "#0fb5a3", "#4dabf7", "#f783ac", "#2fbf71"];
        function confettiBurst(count) {
          if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
          for (var i = 0; i < count; i++) {
            var piece = document.createElement("div");
            piece.className = "confetti-piece";
            var size = 8 + Math.random() * 10;
            piece.style.width = size + "px";
            piece.style.height = (Math.random() > 0.5 ? size : size * 0.45) + "px";
            piece.style.background = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
            piece.style.borderRadius = Math.random() > 0.5 ? "50%" : "3px";
            piece.style.left = (Math.random() * 100) + "vw";
            el.confettiLayer.appendChild(piece);
            var drift = (Math.random() - 0.5) * 220;
            var spin = (Math.random() - 0.5) * 720;
            var fall = window.innerHeight * (0.75 + Math.random() * 0.35);
            var anim = piece.animate(
              [
                { transform: "translate(0, -5vh) rotate(0deg)", opacity: 1 },
                { transform: "translate(" + drift + "px, " + fall + "px) rotate(" + spin + "deg)", opacity: 0.9 }
              ],
              { duration: 1400 + Math.random() * 1200, easing: "cubic-bezier(0.2, 0.7, 0.4, 1)", delay: Math.random() * 200 }
            );
            (function (p, a) {
              var done = function () { if (p.parentNode) p.parentNode.removeChild(p); };
              if (a && a.finished && a.finished.then) { a.finished.then(done).catch(done); }
              else { setTimeout(done, 3000); }
            })(piece, anim);
          }
        }

        /* ---------- Correct-pick particles ---------- */
        function sparkle(x, y, colors) {
          if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
          for (var i = 0; i < 10; i++) {
            var p = document.createElement("div");
            p.className = "pop-particle";
            var size = 7 + Math.random() * 8;
            p.style.width = size + "px";
            p.style.height = size + "px";
            p.style.background = colors[i % colors.length];
            p.style.left = x + "px";
            p.style.top = y + "px";
            document.body.appendChild(p);
            var ang = (Math.PI * 2 * i) / 10 + Math.random() * 0.5;
            var dist = 46 + Math.random() * 44;
            var anim = p.animate(
              [
                { transform: "translate(-50%, -50%) scale(1)", opacity: 1 },
                { transform: "translate(" + (Math.cos(ang) * dist - size / 2) + "px," + (Math.sin(ang) * dist - size / 2) + "px) scale(0.2)", opacity: 0 }
              ],
              { duration: 480 + Math.random() * 220, easing: "ease-out" }
            );
            (function (el2, a) {
              var done = function () { if (el2.parentNode) el2.parentNode.removeChild(el2); };
              if (a && a.finished && a.finished.then) { a.finished.then(done).catch(done); }
              else { setTimeout(done, 900); }
            })(p, anim);
          }
        }

        /* ---------- Speech ---------- */
        function speak(text) {
          try {
            if (!("speechSynthesis" in window)) return;
            window.speechSynthesis.cancel();
            var u = new SpeechSynthesisUtterance(text);
            u.rate = 0.95;
            u.pitch = 1.05;
            window.speechSynthesis.speak(u);
          } catch (e) { /* speech is a bonus — game continues without it */ }
        }

        /* ---------- Round flow ---------- */
        function startGame() {
          rounds = CARDS.slice(); // fixed progressive order: easy → medium → hard
          roundIndex = 0;
          score = 0;
          firstTryWins = 0;
          el.scoreNow.textContent = "0";
          setProgress(0);
          el.winCard.classList.remove("show");
          el.gameCard.style.display = "";
          renderRound();
        }

        function current() { return rounds[roundIndex]; }

        function renderRound() {
          locked = false;
          var r = current();
          el.roundNow.textContent = (roundIndex + 1);
          el.levelBadge.className = "level-badge " + r.level;
          el.levelBadge.textContent = LEVEL_LABELS[r.level];
          el.bigEmoji.textContent = r.emoji;
          el.passageText.textContent = r.passage;

          el.feedback.className = "feedback";
          el.feedback.textContent = "";
          el.sayitZone.classList.remove("show");
          el.sayBtn.style.display = "";
          el.saidBtn.classList.remove("show");

          el.choices.innerHTML = "";
          var options = shuffle([{ text: r.answer, isAnswer: true }].concat(
            r.others.map(function (o) { return { text: o, isAnswer: false }; })
          ));
          options.forEach(function (opt, i) {
            var b = document.createElement("button");
            b.type = "button";
            b.className = "choice";
            b.setAttribute("aria-label", "Choice " + LETTERS[i] + ": " + opt.text);
            var letter = document.createElement("span");
            letter.className = "choice-letter";
            letter.textContent = LETTERS[i];
            var label = document.createElement("span");
            label.textContent = opt.text;
            b.appendChild(letter);
            b.appendChild(label);
            b.addEventListener("click", function () { pick(b, opt); });
            el.choices.appendChild(b);
          });
          setProgress(roundIndex);
        }

        function pick(btn, opt) {
          if (locked || btn.disabled) return;
          var r = current();
          var buttons = el.choices.querySelectorAll(".choice");

          if (opt.isAnswer) {
            locked = true;
            firstTryWins++;
            var rect = btn.getBoundingClientRect();
            sparkle(rect.left + rect.width / 2, rect.top + rect.height / 2, ["#2fbf71", "#ffc93c", "#ffffff"]);
            btn.classList.add("is-correct");
            setScore(100);
            buttons.forEach(function (b) { if (b !== btn) { b.disabled = true; b.classList.add("is-dim"); } });
            el.feedback.className = "feedback show good";
            el.feedback.innerHTML = "";
            el.feedback.appendChild(document.createTextNode("🎉 Nailed it! That’s what the WHOLE passage is mostly about."));
            var pts = document.createElement("span");
            pts.className = "points";
            pts.textContent = "+100 points!";
            el.feedback.appendChild(document.createElement("br"));
            el.feedback.appendChild(pts);
            confettiBurst(45);
            speak("Nailed it! " + r.answer);
            showSayIt(r);
          } else {
            btn.classList.add("is-wrongpick");
            btn.classList.add("is-dim");
            btn.disabled = true;
            el.feedback.className = "feedback show soft";
            el.feedback.textContent = "💛 Not quite — that’s a detail, not the big picture. The main idea is what the WHOLE passage is mostly about. Try again!";
            speak("Not quite! That is a detail. The main idea is what the whole passage is mostly about. Try again!");
            setTimeout(function () { btn.classList.remove("is-wrongpick"); }, 500);
          }
        }

        function showSayIt(r) {
          el.sayitZone.classList.add("show");
          el.sayBtn.style.display = "";
          el.saidBtn.classList.remove("show");
          el.sayitHint.textContent = "Tap to hear the main idea, then say it out loud!";
          el.sayBtn.setAttribute("data-spoken", r.answer);
        }

        el.sayBtn.addEventListener("click", function () {
          var spoken = el.sayBtn.getAttribute("data-spoken");
          speak(spoken + "! " + spoken + "!");
          el.sayBtn.style.display = "none";
          el.sayitHint.textContent = "Your turn — say it out loud! 🌟";
          el.saidBtn.classList.add("show");
          el.saidBtn.focus();
        });

        el.saidBtn.addEventListener("click", function () {
          setScore(100);
          confettiBurst(18);
          roundIndex++;
          if (roundIndex >= TOTAL) {
            setProgress(TOTAL);
            showWin();
          } else {
            setProgress(roundIndex);
            renderRound();
          }
        });

        function showWin() {
          el.gameCard.style.display = "none";
          el.roundNow.textContent = TOTAL;
          el.finalScore.textContent = score;

          var stars = 1;
          if (firstTryWins >= 11) stars = 3;
          else if (firstTryWins >= 7) stars = 2;

          el.starsRow.innerHTML = "";
          for (var i = 0; i < 3; i++) {
            var s = document.createElement("span");
            s.textContent = "★";
            s.className = i < stars ? "earned" : "dim";
            el.starsRow.appendChild(s);
          }
          el.starsRow.setAttribute("aria-label", stars + " out of 3 stars earned");

          if (stars === 3) el.winMessage.textContent = "WOW! You spotted almost every main idea on the first try! 🌟";
          else if (stars === 2) el.winMessage.textContent = "Great reading, main idea master! 🌟";
          else el.winMessage.textContent = "You found all 12 main ideas — great practicing! 🌟";

          el.friendsRecap.innerHTML = "";
          var topics = ["😴 Sleep", "📱 Social media", "💼 Part-time jobs", "🏀 Teamwork", "🎸 Music", "🤝 Volunteering", "📝 Test anxiety", "📚 Reading", "💛 Friendships", "⏰ Time management", "🌱 New things", "🏃 Exercise"];
          topics.forEach(function (t) {
            var chip = document.createElement("span");
            chip.textContent = t;
            el.friendsRecap.appendChild(chip);
          });

          el.winCard.classList.add("show");
          confettiBurst(90);
          speak("You did it! Main ideas — you see the big picture!");
        }

        el.againBtn.addEventListener("click", startGame);

        startGame();
      })();
    </script>
  </body>
</html>
